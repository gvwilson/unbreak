[project]
name = "unbreak"
version = "0.1.0"
description = "unbreaking software"
authors = [{name = "Greg Wilson", email = "gvwilson@third-bit.com"}]
license = {file = "LICENSE.md"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "altair>=6.0.0",
    "faker>=40.11.1",
    "fastapi>=0.136.1",
    "uvicorn>=0.35.0",
    "httpx>=0.27.0",
    "polars>=1.0.0",
    "pytest>=9.0.2",
    "ruff>=0.15.0",
    "vl-convert-python>=1.9.0.post1",
]

[project.urls]
Homepage = "https://gvwilson.github.io/unbreak"
Repository = "https://github.com/gvwilson/unbreak"

[tool.ruff.lint.per-file-ignores]
"oopy/isinstance_check.py" = ["E721"]
"oopy/no_self.py" = ["F821"]
"oopy/static_class.py" = ["F821"]
