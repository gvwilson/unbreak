<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set Consistent Font Sizes with Relative Units</title>
  <style>
    body {
      font-size: 16px;
    }
    /* BUG: each em is relative to the element's own computed font-size, not the root */
    /* BUG: nesting multiplies: .level-1 = 1.5*16=24px, .level-2 = 1.5*24=36px, .level-3 = 1.5*36=54px */
    .level-1 {
      font-size: 1.5em;
    }
    .level-2 {
      font-size: 1.5em;
    }
    .level-3 {
      font-size: 1.5em;
    }
  </style>
</head>
<body>
  <h1>Set consistent font sizes with relative units</h1>
  <p>Each box below uses <code>font-size: 1.5em</code>. Should they all be the same size?</p>
  <div class="level-1">
    Level 1 (1.5em)
    <div class="level-2">
      Level 2 (1.5em)
      <div class="level-3">
        Level 3 (1.5em)
      </div>
    </div>
  </div>
</body>
</html>
